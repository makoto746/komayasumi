name: keep-supabase-alive
on:
  schedule:
    - cron: '17 3 * * *'   # 毎日 03:17 UTC (= 12:17 JST)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST to prevent free-tier auto-pause
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" "https://qtgoqvfqytjqwlqanyzg.supabase.co/rest/v1/counters?select=value&name=eq.visits&apikey=sb_publishable_HG1NXqA7X_6_7lUmXKoyDw_4pcR29KP")
          echo "Supabase HTTP $code"
          test "$code" = "200"
